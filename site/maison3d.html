<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg"><meta name="theme-color" content="#05070c">
  <meta name="description" content="La maison pilote de Parks 3D en trois dimensions : tournez autour, entrez dans une pièce, allumez une lampe.">
  <title>Parks 3D · La maison en trois dimensions</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="maison3d.css?v=1">
  <script type="module" src="maison3d.mjs?v=1"></script>
</head>
<body>
<main class="scene" id="scene" aria-label="Maison pilote en trois dimensions">
  <canvas id="view" aria-hidden="true"></canvas>
  <div class="labels" id="labels"></div>

  <header class="top">
    <a class="mark" href="recit.html" aria-label="Parks 3D, accueil"><i>3D</i>Parks</a>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="modes" role="group" aria-label="Ambiance">
      <button data-mode="day" aria-pressed="false">Bonjour</button>
      <button data-mode="evening" aria-pressed="true">Soirée</button>
      <button data-mode="night" aria-pressed="false">Bonne nuit</button>
    </div>
  </header>

  <button class="back" id="back" hidden>← Vue complète</button>
  <p class="toast" id="toast" role="status" aria-live="polite"></p>
  <p class="hint" id="hint">Glissez pour tourner · Molette ou deux doigts pour zoomer · Touchez une pièce pour y entrer</p>
  <p class="fine">Maison pilote · Équipements et mesures simulés.</p>

  <ul class="list" id="list" aria-label="Lumières de la maison"></ul>
</main>
<noscript><p style="padding:24px;color:#fff">La maison en trois dimensions a besoin de JavaScript.</p></noscript>
</body>
</html>
