<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bona Parks — Immersive 3D Tours</title>
    <meta name="description" content="Bona Parks builds high-resolution digital twins and immersive 3D virtual tours of venues, real estate and cultural heritage in Sardinia." />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0A1114" />

    <link rel="stylesheet" href="/brand/tokens.css" />
    <script>/* Theme before first paint; the full logic is in /brand/theme.js. */
    (function(){var d=document.documentElement,p='auto',q=/[?&]theme=(light|dark|auto)\b/.exec(location.search);try{p=localStorage.getItem('bonaparks-theme')||p}catch(e){}if(q)p=q[1];if(p!=='light'&&p!=='dark')p='auto';var t=p!=='auto'?p:(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');d.setAttribute('data-theme',t);d.setAttribute('data-theme-pref',p);var m=document.querySelector('meta[name="theme-color"]'),c=getComputedStyle(d).getPropertyValue('--theme-color').trim();if(m&&c)m.setAttribute('content',c)})();</script>
    <script src="/brand/theme.js" defer></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            // Semantic color roles. Values live once in /brand/tokens.css.
            colors: {
              ink:         'rgb(var(--c-bg) / <alpha-value>)',      // page background
              surface:     'rgb(var(--c-surface) / <alpha-value>)', // cards, panels
              elev:        'rgb(var(--c-elev) / <alpha-value>)',    // raised / hovered panels
              line:        'rgb(var(--c-navy) / var(--line-alpha))', // borders, dividers
              bone:        'rgb(var(--c-text) / <alpha-value>)',    // primary text
              muted:       'rgb(var(--c-muted) / <alpha-value>)',   // secondary text
              accent:      'rgb(var(--c-accent) / <alpha-value>)',  // buttons, links, focus
              'on-accent': 'rgb(var(--c-on-accent) / <alpha-value>)', // text on accent fills
            },
            fontFamily: {
              display: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"Helvetica Neue"', '"Segoe UI"', 'Roboto', 'Arial', 'sans-serif'],
              sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', '"Helvetica Neue"', '"Segoe UI"', 'Roboto', 'Arial', 'sans-serif'],
            },
          },
        },
      };
    </script>

    <style>
        html { scroll-behavior: smooth; }

        body {
            background-color: rgb(var(--c-bg));
            color: rgb(var(--c-text));
            -webkit-font-smoothing: antialiased;
        }

        /* Soft glow from the top, like the app icon, so large flat areas keep some depth */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image: radial-gradient(circle at 50% 0%, rgb(var(--c-glow) / var(--glow-alpha)), transparent 55%);
        }

        /* Apple-style headings: system font (SF Pro on Apple devices), semibold, tight tracking */
        .font-display { font-weight: 600; letter-spacing: -0.022em; }

        ::selection { background: rgb(var(--c-accent)); color: rgb(var(--c-on-accent)); }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: rgb(var(--c-bg)); }
        ::-webkit-scrollbar-thumb { background: rgb(var(--c-thumb)); border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: rgb(var(--c-thumb-hover)); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(28px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-rise { animation: riseIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }

        @media (prefers-reduced-motion: reduce) {
            .animate-fade-in, .animate-rise { animation: none; }
            html { scroll-behavior: auto; }
        }
    </style>
</head>
<body>
    <!-- Static copies of the React forms so Netlify Forms detects them at deploy time. Field names must match components/pages/B2BHubPage.tsx. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="lang" /><input name="name" /><input name="company" /><input name="email" /><textarea name="message"></textarea>
    </form>
    <form name="scan-link" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="lang" /><input name="email" /><input name="link" />
    </form>
    <form name="rfp" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input name="bot-field" /><input name="lang" /><input name="email" /><input type="file" name="file" />
    </form>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
