<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bona Parks — Immersive 3D Tours</title>
    <meta name="description" content="Bona Parks builds high-resolution digital twins and immersive 3D virtual tours of venues, real estate and cultural heritage in Sardinia." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/brand/tokens.css" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            // Semantic color roles. Values live once in /brand/tokens.css.
            colors: {
              ink:         'rgb(var(--c-bg) / <alpha-value>)',      // page background
              surface:     'rgb(var(--c-surface) / <alpha-value>)', // cards, panels
              elev:        'rgb(var(--c-elev) / <alpha-value>)',    // raised / hovered panels
              line:        'rgb(var(--c-navy) / var(--line-alpha))', // borders, dividers
              bone:        'rgb(var(--c-text) / <alpha-value>)',    // primary text
              muted:       'rgb(var(--c-muted) / <alpha-value>)',   // secondary text
              accent:      'rgb(var(--c-accent) / <alpha-value>)',  // buttons, links, focus
              'on-accent': 'rgb(var(--c-deep) / <alpha-value>)',    // text on accent
            },
            fontFamily: {
              display: ['"Instrument Serif"', 'Georgia', 'serif'],
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            },
            letterSpacing: {
              widest2: '0.22em',
            },
          },
        },
      };
    </script>

    <style>
        html { scroll-behavior: smooth; }

        body {
            background-color: rgb(var(--c-bg));
            color: rgb(var(--c-text));
            -webkit-font-smoothing: antialiased;
        }

        /* Soft glow from the top, like the app icon, so large flat areas keep some depth */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image: radial-gradient(circle at 50% 0%, rgb(var(--c-glow) / 0.16), transparent 55%);
        }

        ::selection { background: rgb(var(--c-accent)); color: rgb(var(--c-deep)); }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: rgb(var(--c-bg)); }
        ::-webkit-scrollbar-thumb { background: rgb(var(--c-navy)); border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: rgb(var(--c-glow)); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(28px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-rise { animation: riseIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }

        @media (prefers-reduced-motion: reduce) {
            .animate-fade-in, .animate-rise { animation: none; }
            html { scroll-behavior: auto; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
