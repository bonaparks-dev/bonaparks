[build]
  command = "npm run build"
  publish = "dist"

# Rendu réaliste des scans de l'app iOS (rendu-scan + rendu-scan-background).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."parks-studio"]
  included_files = ["site/studio.html"]

[[redirects]]
  from = "/studio.html"
  to = "/.netlify/functions/parks-studio"
  status = 200
  force = true

[[redirects]]
  from = "/studio"
  to = "/.netlify/functions/parks-studio"
  status = 200
  force = true

# The home address shows the product page; the house in three dimensions is /maison3d.html, the earlier demo /index.html.
[[redirects]]
  from = "/"
  to = "/accueil.html"
  status = 200
  force = true

# Static pages of the Bonaparks iOS app (public/).
# App Store Connect links to these URLs: keep them stable.
[[redirects]]
  from = "/confidentialite"
  to = "/confidentialite/index.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/support/index.html"
  status = 200

[[redirects]]
  from = "/en/privacy"
  to = "/en/privacy/index.html"
  status = 200

[[redirects]]
  from = "/en/support"
  to = "/en/support/index.html"
  status = 200

# This is a static multi-page site. Missing scripts must return 404, not HTML.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/supranu/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
